services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: IdentityService
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=careerconnect_identity;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Database__ApplyMigrations: "true"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      InternalApiKey: ${INTERNAL_API_KEY}
      ServiceUrls__CompanyService: http://company-service:8080/
      ServiceUrls__ApplicationService: http://application-service:8080/
      ServiceUrls__QuizService: http://quiz-service:8080/
      SeedAdmin__Enabled: "true"
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  candidate-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: CandidateService
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=careerconnect_candidate;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Database__ApplyMigrations: "true"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      InternalApiKey: ${INTERNAL_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: NotificationService
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=careerconnect_notification;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Database__ApplyMigrations: "true"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      InternalApiKey: ${INTERNAL_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  company-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: CompanyService
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=careerconnect_company;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Database__ApplyMigrations: "true"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      InternalApiKey: ${INTERNAL_API_KEY}
      ServiceUrls__NotificationService: http://notification-service:8080/
    depends_on:
      postgres:
        condition: service_healthy
      notification-service:
        condition: service_started

  application-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: ApplicationService
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=careerconnect_application;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Database__ApplyMigrations: "true"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      InternalApiKey: ${INTERNAL_API_KEY}
      ServiceUrls__CandidateService: http://candidate-service:8080/
      ServiceUrls__CompanyService: http://company-service:8080/
      ServiceUrls__QuizService: http://quiz-service:8080/
      ServiceUrls__NotificationService: http://notification-service:8080/
    depends_on:
      postgres:
        condition: service_healthy
      candidate-service:
        condition: service_started
      company-service:
        condition: service_started
      notification-service:
        condition: service_started

  quiz-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: QuizService
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=careerconnect_quiz;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Database__ApplyMigrations: "true"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      InternalApiKey: ${INTERNAL_API_KEY}
      ServiceUrls__ApplicationService: http://application-service:8080/
      ServiceUrls__CompanyService: http://company-service:8080/
      ServiceUrls__NotificationService: http://notification-service:8080/
    depends_on:
      postgres:
        condition: service_healthy
      application-service:
        condition: service_started
      company-service:
        condition: service_started
      notification-service:
        condition: service_started

  matching-service-one:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: MatchingService
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      ServiceUrls__CandidateService: http://candidate-service:8080/
      ServiceUrls__CompanyService: http://company-service:8080/
    depends_on:
      candidate-service:
        condition: service_started
      company-service:
        condition: service_started

  matching-service-two:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: MatchingService
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      ServiceUrls__CandidateService: http://candidate-service:8080/
      ServiceUrls__CompanyService: http://company-service:8080/
    depends_on:
      candidate-service:
        condition: service_started
      company-service:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "5001:8080"
    depends_on:
      identity-service:
        condition: service_started
      candidate-service:
        condition: service_started
      company-service:
        condition: service_started
      application-service:
        condition: service_started
      quiz-service:
        condition: service_started
      matching-service-one:
        condition: service_started
      matching-service-two:
        condition: service_started
      notification-service:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:5001/api
    ports:
      - "5173:80"
    depends_on:
      api-gateway:
        condition: service_started

volumes:
  postgres-data:
